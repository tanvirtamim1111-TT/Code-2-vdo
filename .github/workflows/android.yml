name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon and splash
        continue-on-error: true
        run: npx -y @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0b1020' --splashBackgroundColor '#0b1020'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Code2Video.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Code2Video-apk
          path: Code2Video.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Code2Video v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Code2Video.apk
          body: |
            📱 **Code2Video.apk** ডাউনলোড করে ফোনে ইনস্টল করুন।
            প্রথমবার “Install unknown apps / অজানা উৎস” অনুমতি দিতে হতে পারে।
